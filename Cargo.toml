[package]
name = "jumptrace"
version = "0.2.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
csv = "1.4.0"
eframe = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
